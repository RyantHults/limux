name: Release limux AppImage

# Build and publish a self-contained limux AppImage on every v* tag push.
#   git tag v0.1.0 && git push origin v0.1.0
#
# Distinct from release-daemon.yml (which fires on limuxd-remote-v* tags).
# Both release trains can coexist in the same repo without conflict —
# their tag globs do not overlap.

on:
  push:
    tags:
      - "v*"
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-24.04
    env:
      ZIG_VERSION: "0.15.2"
      # Required for linuxdeploy + appimagetool to run in containerless CI
      # (FUSE is unavailable on the runner, so the AppImage runtime must
      # self-extract instead of mounting).
      APPIMAGE_EXTRACT_AND_RUN: "1"
      # Avoid the .relr.dyn strip regression in linuxdeploy's bundled
      # strip on modern binutils.
      NO_STRIP: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake \
            libgtk-4-dev libwebkitgtk-6.0-dev libadwaita-1-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxrandr-dev libwayland-dev \
            libgdk-pixbuf-2.0-dev libglib2.0-dev libcairo2-dev libpango1.0-dev \
            libglib2.0-bin librsvg2-common librsvg2-bin \
            libfuse2 patchelf file curl ca-certificates \
            desktop-file-utils gettext python3

      - name: Install Zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
          # Same rationale as ci.yml: the .zig-cache restore skips the
          # zig-out emission that the downstream cargo link depends on.
          use-cache: false

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build libghostty
        run: |
          cd ghostty
          # -Dcpu=x86_64_v3 (AVX2 baseline): zig's default is the build
          # machine's native CPU, and GitHub's ubuntu-24.04 runner fleet
          # is heterogeneous. Without a pin, the same source builds to
          # different machine code depending on which runner picks up the
          # job — a newer runner emits AVX-512/EVEX instructions that
          # SIGILL on older CPUs (the v0.2.2 incident). x86_64_v3 matches
          # the proven-good 0.2.1 build and runs on any 2013+ x86_64 CPU.
          zig build -Dapp-runtime=none -Demit-lib-vt=false \
            -Demit-xcframework=false -Doptimize=ReleaseFast \
            -Dcpu=x86_64_v3

      - name: Build Rust binaries
        run: cargo build --release

      - name: Build AppImage
        run: scripts/build-appimage.sh

      - name: Verify AppImage structure
        # Catch packaging regressions at CI time. Type-2 AppImages report
        # as `static-pie linked, stripped` (the loader's ELF metadata),
        # so `file(1)` alone isn't a reliable check. The one invariant
        # every valid AppImage has is an embedded squashfs filesystem,
        # identified by the `hsqs` magic bytes. Also: any lib symlink
        # pointing at /nix/store is a fatal misconfig, since the
        # AppImage must be self-contained and Nix-store paths only
        # resolve on NixOS.
        run: |
          set -euo pipefail
          APPIMAGE="$(ls dist/limux-*-x86_64.AppImage | head -1)"
          echo ">>> file: $(file "$APPIMAGE")"
          if ! grep -qa $'hsqs' "$APPIMAGE" 2>/dev/null; then
            echo "::error::$APPIMAGE has no squashfs magic (not an AppImage)"
            exit 1
          fi
          # Type-2 AppImages have the squashfs at a non-zero offset, so
          # plain `unsquashfs` (which assumes offset 0) fails. Find the
          # offset by searching for the `hsqs` magic and validate the
          # first candidate with `unsquashfs -s` (header-only check).
          # Mirrors the extract_appimage() helper in build-appimage.sh.
          SQUASHFS_OFFSET=""
          while IFS=: read -r candidate _; do
            [[ -z "$candidate" ]] && continue
            if unsquashfs -s -o "$candidate" "$APPIMAGE" >/dev/null 2>&1; then
              SQUASHFS_OFFSET="$candidate"
              break
            fi
          done < <(grep -boa $'hsqs' "$APPIMAGE" 2>/dev/null || true)
          if [[ -z "$SQUASHFS_OFFSET" ]]; then
            echo "::error::$APPIMAGE has hsqs magic but no valid squashfs superblock"
            exit 1
          fi
          echo ">>> squashfs offset: $SQUASHFS_OFFSET"
          TEMP_DIR="$(mktemp -d)"
          unsquashfs -q -d "$TEMP_DIR/root" -o "$SQUASHFS_OFFSET" "$APPIMAGE"
          REAL_COUNT=$(find "$TEMP_DIR/root/usr/lib" -name '*.so*' -type f 2>/dev/null | wc -l)
          LINK_COUNT=$(find "$TEMP_DIR/root/usr/lib" -name '*.so*' -type l 2>/dev/null | wc -l)
          NIX_LINKS=$(find "$TEMP_DIR/root/usr/lib" -name '*.so*' -type l \
                      -exec readlink {} \; 2>/dev/null | grep -c '/nix/store' || true)
          echo ">>> real .so* files: $REAL_COUNT"
          echo ">>> .so* symlinks:   $LINK_COUNT"
          echo ">>> /nix/store symlinks: $NIX_LINKS"
          if (( NIX_LINKS > 0 )); then
            echo "::error::Found $NIX_LINKS libraries symlinked to /nix/store — not portable"
            exit 1
          fi
          rm -rf "$TEMP_DIR"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: limux-appimage
          path: dist/limux-*-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: limux-appimage
          path: dist

      - name: Set executable permissions
        # GitHub releases don't preserve file permissions. Ensure the
        # AppImage is executable before attaching it to the release.
        run: chmod +x dist/limux-*-x86_64.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/limux-*-x86_64.AppImage
          # softprops normalizes refs/tags/<name> to <name> automatically
          # when no tag_name is provided, so v* tags produce proper releases.
          generate_release_notes: true
